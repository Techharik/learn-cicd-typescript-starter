on:
  push:
    branches:
      [main]
jobs:
  deploy:
    name : Deploy
    runs-on : ubuntu-latest

    steps:
       - name : checkout the code
         uses : actions/checkout@v4
       
       - name : Set up Node
         uses: actions/setup-node@v4
         with:
           node-version: 22

       - name: Install dependencies
         run : npm ci

       - name : Build The Apps
         run  : npm run build
     
    steps:
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: 'Use gcloud CLI'
      run: 'gcloud info'

    steps:
      name : Build the docker file and push to artifacts
      run  : gcloud builds submit --tag us-central1-docker.pkg.dev/notely-493908/notely-ar-repo/notely:start . 

